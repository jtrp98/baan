<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>BAAN Live Monitor</title>
  <link rel="stylesheet" href="/ui/pixel.css">
  <script type="module" src="/ui/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workshop">Skip to active sessions</a>

  <header class="hq-header px-box">
    <div class="hq-brand">
      <h1 class="hq-title"><span aria-hidden="true">🏗️</span> BAAN</h1>
      <span class="hq-ws" id="ws-label">…</span>
    </div>
    <div class="hq-controls">
      <span class="conn-badge" id="conn-status" data-state="NO DATA" role="status" aria-live="polite">NO DATA</span>
      <span class="active-count" id="active-count" aria-live="polite">0 ACTIVE</span>
      <button type="button" class="px-btn" id="btn-refresh-quota">🔄 REFRESH QUOTA</button>
      <button type="button" class="px-btn" id="btn-anim" aria-pressed="true">ANIMATION: ON</button>
    </div>
  </header>

  <nav class="hq-tabs" id="tab-container" aria-label="Project scope">
    <button type="button" class="px-btn tab-btn" data-scope="all" aria-pressed="true">🌐 ALL</button>
  </nav>

  <main class="hq-main">
    <section class="hq-office-col" aria-labelledby="office-heading">
      <h2 class="section-title" id="office-heading">🏢 OFFICE</h2>
      <div class="zone-tabs" id="zone-tabs" role="group" aria-label="Jump to office zone">
        <button type="button" class="px-btn px-btn-sm" data-zone="management">MANAGEMENT</button>
        <button type="button" class="px-btn px-btn-sm" data-zone="planning">PLANNING</button>
        <button type="button" class="px-btn px-btn-sm" data-zone="development">DEVELOPMENT</button>
        <button type="button" class="px-btn px-btn-sm" data-zone="qa">QA</button>
        <button type="button" class="px-btn px-btn-sm" data-zone="design">DESIGN</button>
        <button type="button" class="px-btn px-btn-sm" data-zone="lounge">LOUNGE</button>
      </div>
      <div class="office-frame px-box">
        <div class="office-wrap" id="office-wrap" tabindex="0" aria-label="Pixel office view (scrollable)">
          <canvas id="office-canvas" width="640" height="384" role="img"
            aria-label="Animated pixel office showing BAAN roles and AI provider characters. Use the roster buttons below for an accessible list.">
          </canvas>
        </div>
      </div>
      <div class="roster" id="roster" role="group" aria-label="Characters — select to inspect"></div>
      <section class="pipeline-panel px-box" aria-labelledby="pipeline-heading">
        <h2 class="section-title" id="pipeline-heading">⛓ PIPELINE</h2>
        <div id="pipeline"></div>
      </section>
    </section>

    <section class="hq-workshop-col px-box" aria-labelledby="workshop-heading">
      <h2 class="section-title" id="workshop-heading">⚡ ACTIVE SESSIONS</h2>
      <div class="workshop" id="workshop" tabindex="-1"></div>
    </section>
  </main>

  <section class="hq-usage" aria-labelledby="usage-heading">
    <h2 class="section-title" id="usage-heading">📊 USAGE &amp; QUOTA</h2>
    <div class="usage-cards" id="usage-cards"></div>
  </section>

  <section class="hq-quests" aria-labelledby="quest-heading">
    <h2 class="section-title" id="quest-heading">📜 RUN HISTORY</h2>
    <div class="quest-log" id="quest-log"></div>
  </section>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title">
    <div class="rpg-box detail-box">
      <div class="detail-head">
        <h2 class="detail-title" id="detail-title">DETAILS</h2>
        <button type="button" class="px-btn px-btn-sm" id="detail-close" aria-label="Close details">✕ CLOSE</button>
      </div>
      <div class="detail-body" id="detail-body"></div>
    </div>
  </dialog>
</body>
</html>
