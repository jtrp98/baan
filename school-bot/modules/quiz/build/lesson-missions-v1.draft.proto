syntax = "proto3";

package ServiceSchoolBot;

option csharp_namespace = "SchoolBot.Infrastructure.Protos";

service LessonMissionService {
  rpc ListLevels (LessonMissionListLevelsRequest) returns (LessonMissionListLevelsResponse);
  rpc GetMap (LessonMissionGetMapRequest) returns (LessonMissionMapResponse);
  rpc Prepare (LessonMissionPrepareRequest) returns (LessonMissionPrepareResponse);
  rpc Sync (LessonMissionSyncRequest) returns (LessonMissionAttemptResponse);
  rpc CheckAnswer (LessonMissionCheckAnswerRequest) returns (LessonMissionAnswerFeedback);
  rpc GetClassroom (LessonMissionGetClassroomRequest) returns (LessonMissionClassroomResponse);
  rpc SetClassroomAccess (LessonMissionSetClassroomAccessRequest) returns (LessonMissionAccessEventView);
}

message LessonMissionListLevelsRequest {}
message LessonMissionListLevelsResponse { repeated LessonMissionLevelView levels = 1; }
message LessonMissionLevelView {
  int32 level_no = 1;
  int32 stage_count = 2;
  optional int32 passed_count = 3;
  optional int32 stars = 4;
}

message LessonMissionGetMapRequest { int32 level_no = 1; }
message LessonMissionMapResponse {
  int32 level_no = 1;
  optional int32 curriculum_id = 2;
  repeated LessonMissionStageView stages = 3;
}
message LessonMissionStageView {
  string stage_key = 1;
  int32 activity_id = 2;
  int32 term_no = 3;
  int32 position = 4;
  map<string, string> title = 5;
  string activity_kind = 6;
  string availability = 7;
  string progress = 8;
  optional int32 stars = 9;
}

message LessonMissionPrepareRequest {
  int32 activity_id = 1;
  optional string clock_session_key = 2;
}
message LessonMissionPrepareResponse {
  int32 activity_id = 1;
  string content_json = 2;
  optional string offline_grant = 3;
  optional string anchor_utc = 4;
  optional string start_before_utc = 5;
  optional string sync_before_utc = 6;
}

message LessonMissionOfflineStart {
  string grant = 1;
  string clock_session_key = 2;
  optional int64 request_sent_ms = 3;
  optional int64 response_received_ms = 4;
  optional int64 started_ms = 5;
}
message LessonMissionStart {
  int32 activity_id = 1;
  optional LessonMissionOfflineStart offline = 2;
}
message LessonMissionFinish {
  oneof activity_result {
    bool instruction_completed = 1;
    int32 submission_id = 2;
    LessonMissionQuizAnswers quiz = 3;
  }
}
message LessonMissionQuizAnswers { repeated LessonMissionAnswer answers = 1; }
message LessonMissionAnswer {
  string question_key = 1;
  oneof response {
    string choice_key = 2;
    LessonMissionKeyOrder order = 3;
    LessonMissionMatches match = 4;
    LessonMissionSliderValues slider = 5;
  }
}
message LessonMissionKeyOrder { repeated string item_keys = 1; }
message LessonMissionMatches { map<string, string> by_slot = 1; }
message LessonMissionSliderValues { map<string, int32> degrees_by_axis = 1; }

message LessonMissionSyncRequest {
  string attempt_key = 1;
  optional LessonMissionStart start = 2;
  optional LessonMissionFinish finish = 3;
}
message LessonMissionAttemptResponse {
  string attempt_key = 1;
  int32 activity_id = 2;
  string start_status = 3;
  string progress = 4;
  string start_received_at = 5;
  optional string finish_received_at = 6;
  optional string earned_score = 7;
  optional string max_score = 8;
  optional int32 stars = 9;
}

message LessonMissionCheckAnswerRequest {
  string attempt_key = 1;
  LessonMissionAnswer answer = 2;
}
message LessonMissionAnswerFeedback {
  string question_key = 1;
  bool correct = 2;
  map<string, string> explanation = 3;
  LessonMissionAnswer correct_answer = 4;
}

message LessonMissionScope {
  int32 classroom_id = 1;
  int32 level_no = 2;
  int32 term_no = 3;
  optional string stage_key = 4;
}
message LessonMissionGetClassroomRequest {
  LessonMissionScope scope = 1;
  optional int32 after_learner_id = 2;
  optional int32 page_size = 3;
}
message LessonMissionClassroomResponse {
  repeated LessonMissionAccessEventView access = 1;
  repeated LessonMissionClassroomLearner learners = 2;
  optional int32 next_after_learner_id = 3;
}
message LessonMissionClassroomLearner {
  int32 learner_id = 1;
  repeated LessonMissionAttemptResponse attempts = 2;
}
message LessonMissionSetClassroomAccessRequest {
  LessonMissionScope scope = 1;
  string event_key = 2;
  bool is_open = 3;
  optional int32 expected_event_id = 4;
}
message LessonMissionAccessEventView {
  LessonMissionScope scope = 1;
  bool is_open = 2;
  optional int32 event_id = 3;
  optional string origin = 4;
  optional string occurred_at = 5;
}
